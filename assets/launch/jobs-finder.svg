<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">HiringSignal — AI &amp; Tech Jobs Finder</title>
  <desc id="description">A workflow for AI and Data newsletters and niche job boards: choose from 14 curated employers across AI, developer tools and fintech, filter roles, export CSV and Markdown, then skip saved job IDs on the next run. Three actual owner-test results from 16 October 2026 are shown in source order, not newest-first.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141020"/><stop offset="1" stop-color="#0e0c17"/>
    </linearGradient>
    <radialGradient id="glow" cx=".9" cy=".05" r=".8">
      <stop stop-color="#5b418c" stop-opacity=".33"/><stop offset="1" stop-color="#35294d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#221b32"/><stop offset="1" stop-color="#191522"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .white { fill: #faf7ee; }
      .soft { fill: #bdb5cf; }
      .green { fill: #c8ed98; }
      .caps { font-size: 15px; font-weight: 700; letter-spacing: 1.8px; fill: #a99bbf; }
      .step { font-size: 23px; font-weight: 600; fill: #faf7ee; }
      .hint { font-size: 17px; fill: #bdb5cf; }
      .role { font-size: 23px; font-weight: 600; fill: #faf7ee; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M1088 0v900M1216 0v900M1344 0v900M1472 0v900M960 82h640M960 210h640M960 338h640M960 466h640M960 594h640M960 722h640M960 850h640" stroke="#8f79b3" stroke-opacity=".045"/>

  <g transform="translate(64 42)">
    <rect width="52" height="52" rx="14" fill="#493482"/>
    <path d="M20 18v-4h12v4M13 22h26v19H13z" fill="none" stroke="#faf7ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 28h9m8 0h9M22 26h8v6h-8z" fill="none" stroke="#c8ed98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="34" font-size="27" font-weight="700" class="white">HiringSignal</text>
  </g>
  <rect x="1017" y="48" width="519" height="40" rx="20" fill="#292039" stroke="#4d3c67"/>
  <circle cx="1041" cy="68" r="4" fill="#c8ed98"/>
  <text x="1055" y="75" font-size="18" class="soft">For AI / Data newsletters &amp; niche job boards</text>

  <text x="64" y="186" font-size="76" font-weight="750" letter-spacing="-2.7" class="white">AI &amp; Tech Jobs Finder</text>
  <text x="66" y="234" font-size="26" class="soft">Turn public employer feeds into a useful, deduplicated jobs digest.</text>

  <g transform="translate(64 270)">
    <rect width="259" height="42" rx="12" fill="#c8ed98"/>
    <text x="20" y="28" font-size="20" font-weight="700" fill="#1a2710">14 curated employers</text>
    <rect x="274" width="409" height="42" rx="12" fill="#282035" stroke="#49395c"/>
    <text x="294" y="28" font-size="20" class="white">AI · Developer tools · Fintech</text>
    <rect x="698" width="394" height="42" rx="12" fill="#282035" stroke="#49395c"/>
    <text x="718" y="28" font-size="20" class="white">Greenhouse · Lever · Ashby</text>
  </g>

  <rect x="64" y="350" width="426" height="396" rx="22" fill="url(#panel)" stroke="#3d314f"/>
  <text x="90" y="391" font-size="24" font-weight="650" class="white">One repeatable workflow</text>
  <path d="M109 442v236" stroke="#4b3c64" stroke-width="2"/>
  <g transform="translate(90 423)">
    <circle cx="19" cy="19" r="19" fill="#493482"/><text x="19" y="26" font-size="19" font-weight="700" text-anchor="middle" class="white">1</text>
    <text x="53" y="17" class="step">Choose employers</text>
    <text x="53" y="43" class="hint">Curated groups or board URLs</text>
  </g>
  <g transform="translate(90 501)">
    <circle cx="19" cy="19" r="19" fill="#493482"/><text x="19" y="26" font-size="19" font-weight="700" text-anchor="middle" class="white">2</text>
    <text x="53" y="17" class="step">Filter roles</text>
    <text x="53" y="43" class="hint">Title, location &amp; workplace type</text>
  </g>
  <g transform="translate(90 579)">
    <circle cx="19" cy="19" r="19" fill="#493482"/><text x="19" y="26" font-size="19" font-weight="700" text-anchor="middle" class="white">3</text>
    <text x="53" y="17" class="step">CSV + Markdown</text>
    <text x="53" y="43" class="hint">A ready-to-edit jobs digest</text>
  </g>
  <g transform="translate(90 657)">
    <circle cx="19" cy="19" r="19" fill="#c8ed98"/><text x="19" y="26" font-size="19" font-weight="700" text-anchor="middle" fill="#1a2710">4</text>
    <text x="53" y="17" class="step">Skip saved IDs next run</text>
    <text x="53" y="43" class="hint">Pass your previous KNOWN_JOB_IDS</text>
  </g>

  <rect x="514" y="350" width="1022" height="396" rx="22" fill="url(#panel)" stroke="#4c3b63"/>
  <text x="542" y="391" font-size="24" font-weight="650" class="white">An AI / Data digest, from source fields</text>
  <rect x="1335" y="369" width="173" height="32" rx="16" fill="#352744"/>
  <text x="1421" y="391" font-size="16" text-anchor="middle" class="soft">3 sample roles</text>
  <path d="M514 418h1022" stroke="#3d314f"/>
  <text x="542" y="450" class="caps">ROLE</text>
  <text x="1004" y="450" class="caps">EMPLOYER</text>
  <text x="1230" y="450" class="caps">LOCATION / WORKPLACE</text>

  <rect x="532" y="469" width="986" height="69" rx="10" fill="#2d2340"/>
  <text x="549" y="511" class="role">Data Engineer</text>
  <text x="1004" y="511" font-size="22" class="soft">ElevenLabs</text>
  <text x="1230" y="496" font-size="21" class="white">United Kingdom</text>
  <text x="1230" y="523" font-size="18" class="green">Remote</text>

  <text x="549" y="592" class="role">Safety Engineer (Data)</text>
  <text x="1004" y="592" font-size="22" class="soft">ElevenLabs</text>
  <text x="1230" y="577" font-size="21" class="white">London</text>
  <text x="1230" y="604" font-size="18" fill="#e9d2a6">Hybrid</text>
  <path d="M542 625h966" stroke="#3d314f"/>

  <text x="549" y="672" class="role">Software Engineer, RL Data</text>
  <text x="1004" y="672" font-size="22" class="soft">Cursor</text>
  <text x="1230" y="657" font-size="21" class="white">San Francisco</text>
  <text x="1230" y="684" font-size="18" class="soft">Onsite</text>
  <text x="542" y="724" font-size="17" class="soft">Source order · capped sample · not newest-first</text>

  <rect x="64" y="774" width="1472" height="58" rx="15" fill="#211a2e" stroke="#3d314f"/>
  <path d="M89 802l6 6 12-14" fill="none" stroke="#c8ed98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="123" y="811" font-size="21" font-weight="600" class="white">CSV + Markdown + reusable job IDs</text>
  <text x="1490" y="810" font-size="18" text-anchor="end" class="soft">Remote location comes from the feed; eligibility varies by role.</text>

  <text x="66" y="870" font-size="18" class="soft">Actual owner test · 16 Oct 2026 · capped sample</text>
  <text x="1534" y="870" font-size="18" text-anchor="end" class="soft">HiringSignal / public ATS feeds</text>
</svg>
