[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hiringsignal-apify"
version = "0.3.0"
description = "Curated employer Jobs Finder for AI/Data newsletters and job boards, with public ATS feeds, filtered exports and repeat-run deduplication."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.12,<4", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
actor = ["apify>=3.4,<4"]

[project.scripts]
hiringsignal = "hiringsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
